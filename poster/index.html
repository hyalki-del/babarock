<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Voting Game</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f3f4f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; box-sizing: border-box; }
        h1, h2 { color: #1f2937; margin-top: 0; }
        .hidden { display: none !important; }
        .btn-group { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
        button { padding: 0.75rem 1.2rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; color: white; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-guzel { background: var(--success); }
        .btn-kararsiz { background: var(--warning); }
        .btn-kotu { background: var(--danger); }
        .btn-primary { background: var(--primary); width: 100%; }
        .btn-back { background: #6b7280; }
        select { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; border: 1px solid #d1d5db; border-radius: 0.5rem; box-sizing: border-box; }
        .poster-container { margin: 1rem 0; height: 320px; display: flex; justify-content: center; align-items: center; background: #e5e7eb; border-radius: 0.5rem; overflow: hidden; }
        .poster-container img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .counter { font-weight: bold; color: #4b5563; margin-bottom: 0.5rem; }
        .podium-item { display: flex; align-items: center; justify-content: space-between; background: #f9fafb; padding: 0.5rem 1rem; margin: 0.5rem 0; border-radius: 0.5rem; border: 1px solid #e5e7eb; }
        .podium-item img { width: 45px; height: 45px; object-fit: cover; border-radius: 0.25rem; }
        .reset-link { margin-top: 1.5rem; font-size: 0.8rem; color: #9ca3af; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="card" id="login-screen">
        <h2>🎨 Poster Voting Game</h2>
        <p>Please select your initials to start:</p>
        <select id="initials-select">
            <option value="" disabled selected>-- Choose Initials --</option>
            <option value="S.A.">S.A.</option>
            <option value="O.E.">O.E.</option>
            <option value="O.G.">O.G.</option>
            <option value="I.O.">I.O.</option>
            <option value="H.Y.">H.Y.</option>
        </select>
        <button class="btn-primary" onclick="startVoting()">Start Game</button>
        <div class="reset-link" onclick="triggerReset()">Reset All System Votes</div>
    </div>

    <!-- Game Screen -->
    <div class="card hidden" id="game-screen">
        <div class="counter" id="counter">Loading...</div>
        <div class="poster-container">
            <img id="poster-img" src="" alt="Poster">
        </div>
        <div class="btn-group">
            <button class="btn-back" id="back-btn" onclick="prevPoster()" disabled>Back</button>
            <button class="btn-guzel" onclick="vote('güzel')">Güzel</button>
            <button class="btn-kararsiz" onclick="vote('kararsız')">Kararsız</button>
            <button class="btn-kotu" onclick="vote('kötü')">Kötü</button>
        </div>
    </div>

    <!-- Result Popup/Screen -->
    <div class="card hidden" id="result-screen">
        <h2>🏆 Top 3 Posters</h2>
        <div id="podium-container"><p>Calculating top posters...</p></div>
        <button class="btn-primary" style="margin-top: 1rem;" onclick="location.reload()">Play Again / Switch User</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxpGViY5zHqdkFF8yNNGcUU2eqdspqvnKFmwoYbM1_gvgRnfmd3hXcMugLr0zxZM05V8w/exec";
        let posters = [];
        let currentIndex = 0;
        let selectedInitials = "";

        async function startVoting() {
            const select = document.getElementById("initials-select");
            if (!select.value) {
                alert("Please select your initials first!");
                return;
            }
            selectedInitials = select.value;

            try {
                let response = await fetch(`${API_URL}?action=getPosters`);
                posters = await response.json();
                
                if (posters.length === 0) {
                    alert("No JPEG posters found in your Google Drive folder!");
                    return;
                }
                
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.remove("hidden");
                renderPoster();
            } catch (err) {
                alert("Failed to load posters from API. Check your Apps Script URL.");
                console.error(err);
            }
        }

        function renderPoster() {
            document.getElementById("counter").innerText = `${currentIndex + 1} / ${posters.length}`;
            document.getElementById("poster-img").src = posters[currentIndex].url;
            document.getElementById("back-btndisabled", currentIndex === 0);
            document.getElementById("back-btn").disabled = currentIndex === 0;
        }

        async function vote(choice) {
            let currentPoster = posters[currentIndex];

            // Send vote to Google Sheets asynchronously in the background
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "submitVote",
                    initials: selectedInitials,
                    posterId: currentPoster.id,
                    vote: choice
                })
            });

            currentIndex++;
            if (currentIndex < posters.length) {
                renderPoster();
            } else {
                showResults();
            }
        }

        function prevPoster() {
            if (currentIndex > 0) {
                currentIndex--;
                renderPoster();
            }
        }

        async function showResults() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");

            try {
                let response = await fetch(`${API_URL}?action=getResults`);
                let topThree = await response.json();
                
                let container = document.getElementById("podium-container");
                container.innerHTML = "";
                
                if(topThree.length === 0) {
                    container.innerHTML = "<p>No votes recorded yet.</p>";
                    return;
                }

                topThree.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="podium-item">
                            <span><b>#${index + 1}</b> (Score: ${item.score})</span>
                            <img src="${item.url}" alt="Poster">
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById("podium-container").innerHTML = "<p>Error loading results.</p>";
            }
        }

        async function triggerReset() {
            let pin = prompt("Security Check: Type 'RESET' to wipe all vote data from the sheet:");
            if (pin === "RESET") {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "resetVotes" })
                });
                alert("All votes have been successfully cleared!");
            }
        }
    </script>
</body>
</html>
