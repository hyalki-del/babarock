<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Poster Face-Off</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --bg: #f3f4f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 750px; text-align: center; box-sizing: border-box; }
        h1, h2 { color: #1f2937; margin-top: 0; }
        .hidden { display: none !important; }
        select { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; border: 1px solid #d1d5db; border-radius: 0.5rem; box-sizing: border-box; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; color: white; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); width: 100%; }
        .battle-arena { display: flex; gap: 1rem; justify-content: center; margin: 1rem 0; flex-wrap: wrap; }
        .poster-card { flex: 1; min-width: 250px; background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 0.75rem; padding: 1rem; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; }
        .poster-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); }
        .poster-img-box { height: 280px; width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 1rem; }
        .poster-img-box img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 0.25rem; }
        .counter { font-weight: bold; color: #4b5563; margin-bottom: 0.5rem; font-size: 1.1rem; }
        .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
        .btn-back { background: #6b7280; padding: 0.5rem 1rem; font-size: 0.9rem; }
        .btn-tie { background: #d97706; padding: 0.5rem 1rem; font-size: 0.9rem; }
        .podium-item { display: flex; align-items: center; justify-content: space-between; background: #f9fafb; padding: 0.75rem 1rem; margin: 0.5rem 0; border-radius: 0.5rem; border: 1px solid #e5e7eb; text-align: left; }
        .podium-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 0.25rem; margin-left: 1rem; }
        .reset-link { margin-top: 1.5rem; font-size: 0.8rem; color: #9ca3af; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="card" id="login-screen">
        <h2>🎸 Band Poster Face-Off</h2>
        <p>Pick your favorite in each head-to-head matchup!</p>
        <p>Select your initials:</p>
        <select id="initials-select">
            <option value="" disabled selected>-- Choose Initials --</option>
            <option value="S.A.">S.A.</option>
            <option value="O.E.">O.E.</option>
            <option value="O.G.">O.G.</option>
            <option value="I.O.">I.O.</option>
            <option value="H.Y.">H.Y.</option>
        </select>
        <button class="btn-primary" onclick="startGame()">Start Battles</button>
        <div class="reset-link" onclick="triggerReset()">Reset All System Votes</div>
    </div>

    <!-- Game Screen -->
    <div class="card hidden" id="game-screen" style="max-width: 750px;">
        <div class="counter" id="counter">Battle 1 / 10</div>
        <p style="color: #6b7280; margin-top: 0;">Which poster do you prefer?</p>
        
        <div class="battle-arena">
            <div class="poster-card" onclick="submitChoice('left')">
                <div class="poster-img-box">
                    <img id="poster-left" src="" alt="Poster A">
                </div>
                <button class="btn-primary" style="pointer-events: none;">👉 Choose This One</button>
            </div>
            
            <div class="poster-card" onclick="submitChoice('right')">
                <div class="poster-img-box">
                    <img id="poster-right" src="" alt="Poster B">
                </div>
                <button class="btn-primary" style="pointer-events: none;">👉 Choose This One</button>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-back" id="back-btn" onclick="prevMatchup()" disabled>⬅️ Back</button>
            <button class="btn-tie" onclick="submitChoice('tie')">🤝 It's a Tie / Skip</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div class="card hidden" id="result-screen">
        <h2>🏆 Top 3 Band Champions</h2>
        <div id="podium-container"><p>Calculating rational consensus...</p></div>
        <button class="btn-primary" style="margin-top: 1rem;" onclick="location.reload()">Play Again / Switch User</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbype6U8aQDzPyD0UgKsFe9hee2gXIInM_8Z9wc-l7sbDEV__WVkNrU9kpGRR92hTwNRhQ/exec";
        let posters = [];
        let matchups = [];
        let currentMatchIndex = 0;
        let selectedInitials = "";
        let historyStack = [];

        async function startGame() {
            const select = document.getElementById("initials-select");
            if (!select.value) {
                alert("Please select your initials first!");
                return;
            }
            selectedInitials = select.value;

            try {
                let response = await fetch(`${API_URL}?action=getPosters`);
                posters = await response.json();
                
                if (posters.length < 2) {
                    alert("You need at least 2 JPEG posters in Google Drive!");
                    return;
                }
                
                generateMatchups();
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.remove("hidden");
                renderMatchup();
            } catch (err) {
                alert("Failed to load posters. Check your Apps Script URL.");
                console.error(err);
            }
        }

        function generateMatchups() {
            matchups = [];
            let shuffled = [...posters].sort(() => Math.random() - 0.5);
            
            // Create up to 10 randomized matchups per session to keep it fast and fun
            for (let i = 0; i < shuffled.length - 1; i += 2) {
                matchups.push({ left: shuffled[i], right: shuffled[i+1] });
            }
            // Limit session to max 10 battles so band members don't get exhausted
            if (matchups.length > 10) {
                matchups = matchups.slice(0, 10);
            }
        }

        function renderMatchup() {
            let current = matchups[currentMatchIndex];
            document.getElementById("counter").innerText = `Battle ${currentMatchIndex + 1} / ${matchups.length}`;
            document.getElementById("poster-left").src = current.left.url;
            document.getElementById("poster-right").src = current.right.url;
            document.getElementById("back-btn").disabled = currentMatchIndex === 0;
        }

        async function submitChoice(choice) {
            let current = matchups[currentMatchIndex];
            let winnerId, loserId, resultType;

            if (choice === 'left') {
                winnerId = current.left.id;
                loserId = current.right.id;
                resultType = "win";
            } else if (choice === 'right') {
                winnerId = current.right.id;
                loserId = current.left.id;
                resultType = "win";
            } else {
                winnerId = current.left.id;
                loserId = current.right.id;
                resultType = "tie";
            }

            historyStack.push({ currentMatchIndex, winnerId, loserId, resultType });

            // Post vote to Google Sheets asynchronously
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "submitMatchup",
                    initials: selectedInitials,
                    winnerId: winnerId,
                    loserId: loserId,
                    resultType: resultType
                })
            });

            currentMatchIndex++;
            if (currentMatchIndex < matchups.length) {
                renderMatchup();
            } else {
                showResults();
            }
        }

        function prevMatchup() {
            if (historyStack.length > 0 && currentMatchIndex > 0) {
                historyStack.pop();
                currentMatchIndex--;
                renderMatchup();
            }
        }

        async function showResults() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");

            try {
                let response = await fetch(`${API_URL}?action=getResults`);
                let topThree = await response.json();
                
                let container = document.getElementById("podium-container");
                container.innerHTML = "";
                
                if(topThree.length === 0) {
                    container.innerHTML = "<p>No matches recorded yet.</p>";
                    return;
                }

                topThree.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="podium-item">
                            <div>
                                <b>#${index + 1}</b> — <b>${item.name}</b><br>
                                <small style="color: #6b7280;">Rating Score: ${item.score} (${item.wins} wins / ${item.matches} battles)</small>
                            </div>
                            <img src="${item.url}" alt="Poster">
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById("podium-container").innerHTML = "<p>Error loading results.</p>";
            }
        }

        async function triggerReset() {
            let pin = prompt("Security Check: Type 'RESET' to wipe all match data from the sheet:");
            if (pin === "RESET") {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "resetVotes" })
                });
                alert("All records have been successfully cleared!");
            }
        }
    </script>
</body>
</html>
